<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Miss Romblon 2026</title>

  <!-- Auto Redirect (3 seconds) -->
  <meta http-equiv="refresh" content="3; url=https://script.google.com/macros/s/AKfycbz_LBfN5MAfg_Q975try7TcNm0WyD_qUhxq58A8TO0FdOyIoHeZPSt1qGH-ReIjhVQ/exec">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Background image (your poster) */
      background: url('https://res.cloudinary.com/dougadt6t/image/upload/v1763350756/FINAL_POSTER_vhqham.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      position: relative;
    }

    /* Soft dark overlay for elegance */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
    }

    /* Loading text */
    .loading-text {
      position: relative;
      color: white;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 3px;
      animation: fade 2s infinite;
      z-index: 10;
    }

    @keyframes fade {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>
  <div class="loading-text">Loading…</div>
</body>
</html>
